<!DOCTYPE html>
<html lang="en">
    <head>
        <title>sigma page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content=" this is sigma page">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
          <header>
            <nav class="navbar">
                <a class="card" href="index.html">Home</a>
                <a class="card" href="about.html">about</a>
                <a class="card" href="contact.html"target="_blank">contact</a>
            </nav>
            <div class="head">
            <h2>This is Sigma's web. <br>Welcome,meow!</h2>
            <img src="sigmaa.jpg" alt="this is sigmaa">
            
             <a href="#Sigma-modal"><div class="card">Open</div></a>
        <div id="Sigma-modal" class="modal">
            <div class="modal-content">
                <p>Sigma is a cool cat!</p>
                <a href="#">Close</a>
            </div>
        </div>
        </div>
        </header>
        <div class="alert" role="status">
          <strong>Welcome!</strong> Feel free to contact Sigma.
        </div>
        <form>
            <h2>Make friend with sigma</h2>
            <p> what's your gender?</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
            <br><br>
            <label for="name">What's your name?</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="age">How old is you?</label>
            <input type="number" id="age" name="age" required>
            <br><br>
            <label for="country">where are you from?:</label>
            <select id="country" name="country">
            <option value="egypt">egypt</option>
            <option value="usa">usa</option>
            <option value="italy">italy</option> 
            <option value="china">china</option> 
            </select>
            <br><br>
            <label for="email">sent me your email's username</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="number">sent me your phone nmber</label>
            <input type="tel" id="number" name="number" required>
            <br><br>
            <label for="date">when do you want meet ?</label>
            <input type="date" id="date" name="date" required>
            <br><br>
            <p>What's your favorite hobby?</p>
            <input type="checkbox" id="mouse_hunting" name="hobbies" value="mouse hunting">
            <label for="mouse_hunting">mouse hunting</label>
            <input type="checkbox" id="watching_tom_jerry" name="hobbies" value="watching tom & jerry">
            <label for="watching_tom_jerry">watching tom & jerry</label>
            <input type="checkbox" id="sleeping" name="hobbies" value="sleeping">
            <label for="sleeping">sleeping</label>
            <br><br>
            <label for="msg">sent Message to sigma:</label>
            <textarea id="msg" name="msg" rows="4" cols="30"></textarea>
            <br><br>
            <button type="submit">Send</button>
        </form>
         <footer>
            <p>&copy; 2026 shimaa</p>
        </footer>
    </body>
</html>
